<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Python App on GitHub</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <h1>My Python Web App</h1>
    <div id="output"></div>

    <script type="py">
        from pyscript import display
        display("Hello from Python running natively on GitHub Pages!", target="output")
    </script>
</body>
</html>
